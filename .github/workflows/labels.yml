name: labels

# Ensures the labels the department relies on exist. Idempotent.
on:
  push:
    branches: [main]
    paths: [.github/workflows/labels.yml]
  workflow_dispatch:

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          gh label create order --color 1D76DB --description "An order from the founder for the department" --force
          gh label create needs-founder --color D93F0B --description "Blocked on a founder-only decision" --force
