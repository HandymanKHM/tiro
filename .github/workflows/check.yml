name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check

  pr-policy:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Run the trusted copy of the policy from the base branch, so a PR
      # cannot turn this check green by editing the policy script itself.
      - run: |
          git show "origin/${{ github.base_ref }}:scripts/pr-policy.mjs" > "$RUNNER_TEMP/pr-policy.mjs"
          node "$RUNNER_TEMP/pr-policy.mjs" "origin/${{ github.base_ref }}" HEAD
